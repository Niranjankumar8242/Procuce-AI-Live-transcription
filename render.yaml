services:
  - type: web
    name: procucev-transcription
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: procucev-postgres
          property: connectionString
      - key: STT_SERVICE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

databases:
  - name: procucev-postgres
    plan: basic-256mb
