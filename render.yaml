services:
  - type: web
    name: procucev-transcription
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: procucev-postgres
          property: connectionString
      # Free hosts do not have enough CPU/RAM for an always-on Whisper model.
      # The production demo uses Chrome/Edge live speech recognition and sends
      # the resulting transcript to this service for PostgreSQL persistence.
      - key: STT_DEMO_MODE
        value: "true"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

databases:
  - name: procucev-postgres
    plan: free
