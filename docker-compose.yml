services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: procucev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d procucev"]
      interval: 5s
      timeout: 5s
      retries: 10

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: base
    volumes:
      - whisper_cache:/root/.cache/huggingface
    ports:
      - "9000:9000"

  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/procucev?sslmode=disable
      STT_SERVICE_URL: http://whisper:9000
      STT_MODEL: base
      STT_REQUEST_TIMEOUT_MS: 30000
      STT_FINALIZE_TIMEOUT_MS: 20000
      STT_WARMUP_TIMEOUT_MS: 900000
    depends_on:
      postgres:
        condition: service_healthy
      whisper:
        condition: service_started
    ports:
      - "4000:4000"

volumes:
  postgres_data:
  whisper_cache:
